<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UIコンポーネント | 山城ヤサカ交通</title>
    <link rel="stylesheet" href="./src/styles.css">
    <link rel="stylesheet" href="./src/components.css">
  </head>
  <body>
    <div class="site-top">
    <header class="app-header">
      <div class="brand-lockup">
        <img class="brand-logo" src="./assets/logo.png" alt="yasaka">
        <div>
          <p class="eyebrow">山城ヤサカ交通 デザイン部品</p>
          <h1>UIコンポーネント</h1>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeButton" type="button">違反テーマに切替</button>
      </div>
    </header>

    <nav class="app-nav" aria-label="ページ切り替え">
      <a href="./index.html">事故</a>
      <a href="./violations.html">違反</a>
      <a href="./components.html" class="is-active">部品</a>
    </nav>
    </div>

    <main class="dashboard">
      <section class="c-card c-card--accent">
        <h2>ボタン</h2>
        <div class="c-btn-group">
          <button class="c-btn" type="button">主操作</button>
          <button class="c-btn c-btn--secondary" type="button">副操作</button>
          <button class="c-btn c-btn--ghost" type="button">テキスト操作</button>
          <button class="c-btn c-btn--danger" type="button">注意操作</button>
        </div>
      </section>

      <section class="c-card">
        <h2>バッジと通知</h2>
        <div class="c-inline">
          <span class="c-badge">通常</span>
          <span class="c-badge c-badge--success">完了</span>
          <span class="c-badge c-badge--warning">注意</span>
          <span class="c-badge c-badge--danger">要確認</span>
        </div>
      </section>

      <section class="c-card">
        <h2>フォーム</h2>
        <div class="filter-grid">
          <label class="c-field">テキスト<input class="c-input" value="宇治橋西詰交差点"></label>
          <label class="c-field">選択<select class="c-select"><option>追突</option><option>速度超過</option></select></label>
          <label class="c-check"><input type="checkbox" checked> 表示対象</label>
          <label class="c-switch"><input type="checkbox"> 通知する</label>
        </div>
      </section>

      <section class="c-alert c-alert--warning">
        CSVには運転者名、乗客名、連絡先などの個人情報を入れないでください。
      </section>

      <section class="c-card">
        <h2>進捗</h2>
        <div class="c-progress"><span style="width: 68%"></span></div>
      </section>
    </main>

    <script>
      const button = document.querySelector('#themeButton');
      button.addEventListener('click', () => {
        document.body.classList.toggle('theme-violations');
        button.textContent = document.body.classList.contains('theme-violations') ? '事故テーマに切替' : '違反テーマに切替';
      });
    </script>
  </body>
</html>
