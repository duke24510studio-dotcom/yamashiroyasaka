<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>交通違反マップ | 山城ヤサカ交通</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css">
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body data-app="violations" class="theme-violations">
    <header class="app-header">
      <div>
        <p id="appEyebrow" class="eyebrow"></p>
        <h1 id="appTitle"></h1>
      </div>
      <div class="header-actions">
        <button id="reloadButton" type="button">再読み込み</button>
        <label class="file-button">
          CSV読込
          <input id="csvInput" type="file" accept=".csv,text/csv">
        </label>
        <button id="printButton" type="button">印刷</button>
      </div>
    </header>
    <nav class="app-nav" aria-label="マップ切り替え">
      <a href="./index.html" data-app-link="accidents">事故</a>
      <a href="./violations.html" data-app-link="violations">違反</a>
      <a href="./enforcement.html" data-app-link="enforcement">取り締まり</a>
      <a href="./pickups.html" data-app-link="pickups">乗車位置</a>
    </nav>
    <main class="dashboard">
      <section class="data-source" aria-label="データ元"><div><span>データ元</span><strong id="sourceLabel">確認中</strong></div><p id="sourceStatus">データを読み込んでいます。</p></section>
      <section class="filters" aria-label="データの絞り込み"><div class="filter-grid"><label>年<select id="yearFilter"></select></label><label>月<select id="monthFilter"></select></label><label id="typeFilterLabel">区分<select id="typeFilter"></select></label><label id="categoryFilterLabel">カテゴリ<select id="categoryFilter"></select></label><label class="search-field">検索<input id="searchInput" type="search" placeholder="場所・概要"></label></div></section>
      <section class="summary" aria-label="集計サマリー"><article><span id="totalLabel"></span><strong id="totalCount">0</strong></article><article><span id="topCategoryLabel"></span><strong id="topCategory">-</strong></article><article><span id="topTimeBandLabel"></span><strong id="topTimeBand">-</strong></article><article><span id="topLocationLabel"></span><strong id="topLocation">-</strong></article></section>
      <section class="workspace"><div class="map-panel"><div id="map" aria-label="地図"></div></div><aside class="insight-panel" aria-label="集計とポイント"><section><h2 id="timeStatsTitle"></h2><div id="timeStats" class="bar-list"></div></section><section><h2 id="categoryStatsTitle"></h2><div id="categoryStats" class="bar-list"></div></section><section><h2 id="locationStatsTitle"></h2><div id="locationStats" class="bar-list"></div></section><section><h2 id="preventionTitle"></h2><ul id="preventionList" class="prevention-list"></ul></section></aside></section>
      <section class="table-panel" aria-label="一覧"><div class="table-heading"><h2 id="listTitle"></h2><p id="activeFilterText">全件を表示中</p></div><div class="table-wrap"><table><thead><tr><th data-table-key="date"></th><th data-table-key="time"></th><th data-table-key="location"></th><th data-table-key="type"></th><th data-table-key="category"></th><th data-table-key="detail"></th><th data-table-key="cause"></th></tr></thead><tbody id="accidentTable"></tbody></table></div></section>
    </main>
    <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
